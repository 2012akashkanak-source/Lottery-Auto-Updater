name: Nagaland Lottery Auto Updater

on:
  schedule:
    - cron: '45 7 * * *'  # 1:15 PM IST
    - cron: '45 12 * * *' # 6:15 PM IST
    - cron: '45 14 * * *' # 8:15 PM IST
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Python Script
        run: python scraper.py

      - name: Save Updated CSV to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add lottery_data.csv
          git commit -m "Nagaland Lottery Auto-update" || echo "No changes"
          git push
